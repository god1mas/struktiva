services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: struktiva
      POSTGRES_USER: struktiva
      POSTGRES_PASSWORD: struktiva_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U struktiva -d struktiva"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
